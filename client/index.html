<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memento Mori</title>
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-panel: #16161f;
      --text-primary: #c8c8d0;
      --text-dim: #6a6a78;
      --text-npc: #d4a574;
      --text-damage: #e05050;
      --text-heal: #50c878;
      --text-system: #5a5a70;
      --text-location: #7aa2d4;
      --border: #2a2a38;
      --accent: #8b5cf6;
      --input-bg: #1a1a25;
      --win-title-bg: #16161f;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; overflow: hidden;
      background: var(--bg-primary); color: var(--text-primary);
      font-family: 'Courier New', Consolas, monospace; font-size: 13px;
    }

    /* TUI Shell */
    #app {
      display: grid; grid-template-rows: auto 1fr auto auto;
      height: 100vh; gap: 4px; padding: 4px;
    }

    /* Header */
    .tui-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 12px; color: var(--text-dim); font-size: 12px;
      border: 1px solid var(--border); border-radius: 2px; background: var(--bg-primary);
    }
    .tui-header .header-title { color: var(--accent); letter-spacing: 2px; font-weight: bold; }
    .tui-header .header-moon { margin-right: 6px; }

    /* Main grid */
    #tui-main {
      display: grid; grid-template-columns: 1fr 260px; gap: 4px;
      overflow: hidden; min-height: 0;
    }
    #left-col { display: flex; flex-direction: column; gap: 4px; min-height: 0; }
    #right-col { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; min-height: 0; }

    /* Window */
    .win {
      border: 1px solid var(--border); border-radius: 2px;
      display: flex; flex-direction: column; background: var(--bg-primary); min-height: 0;
    }
    .win-title {
      background: var(--win-title-bg); padding: 2px 8px; font-size: 11px;
      color: var(--text-dim); border-bottom: 1px solid var(--border);
      text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0;
    }
    .win.resizable { resize: both; overflow: auto; }
    .win-body { padding: 8px 10px; flex: 1; min-height: 0; }

    /* Narrative */
    #narrative-win { flex: 1; min-height: 0; }
    #narrative-win .win-body {
      overflow-y: auto; position: relative;
      font-family: Georgia, 'Times New Roman', serif; font-size: 16px; line-height: 1.7;
    }

    /* Map */
    #map-win .win-body {
      padding: 0; display: flex; flex-direction: row;
    }
    #map-win .map-canvas-wrap {
      flex: 1; min-width: 0; overflow: hidden;
    }
    #map-win canvas { display: block; width: 100%; }

    /* Wiki panel */
    .wiki-panel {
      width: 260px; flex-shrink: 0;
      border-left: 1px solid var(--border);
      padding: 8px 10px;
      overflow: hidden;
      font-size: 13px;
      display: flex; flex-direction: column;
    }
    .wiki-name {
      color: var(--text-npc); font-weight: bold; font-size: 14px;
      margin-bottom: 2px;
    }
    .wiki-labels {
      color: var(--text-dim); font-size: 11px;
      margin-bottom: 8px;
    }
    .wiki-summary {
      color: var(--text-primary); line-height: 1.5;
      margin-bottom: 10px;
    }
    .wiki-section {
      color: var(--text-dim); font-size: 11px;
      margin: 8px 0 4px; letter-spacing: 1px;
    }
    .wiki-link {
      color: var(--text-location); cursor: pointer;
      padding: 1px 0; text-decoration: underline dotted;
    }
    .wiki-link:hover { color: #fff; }
    .wiki-fact {
      color: var(--text-dim); font-size: 12px;
      margin-left: 8px; margin-bottom: 4px;
      font-style: italic;
    }
    .wiki-empty, .wiki-loading {
      color: var(--text-dim); font-style: italic;
      padding-top: 8px;
    }
    .wiki-breadcrumb { margin-bottom: 6px; }
    .wiki-back {
      color: var(--text-dim); cursor: pointer; font-size: 12px;
    }
    .wiki-back:hover { color: var(--text-primary); }
    .wiki-section-header {
      color: var(--text-dim); font-size: 11px; letter-spacing: 1px;
      margin: 6px 0 2px; cursor: pointer; user-select: none;
    }
    .wiki-toc-label {
      color: var(--text-dim); font-size: 11px; margin-top: 8px;
      letter-spacing: 1px;
    }
    .wiki-toc-item {
      color: var(--text-location); cursor: pointer; padding: 1px 0;
      font-size: 12px;
    }
    .wiki-toc-item:hover { color: #fff; }
    .wiki-page-heading {
      color: var(--text-dim); font-size: 11px; letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .wiki-pagination {
      display: flex; justify-content: center; align-items: center;
      gap: 12px; margin-top: auto; padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 12px;
    }
    .wiki-page-btn {
      cursor: pointer; color: var(--text-dim); padding: 2px 4px;
    }
    .wiki-page-btn:hover:not(.disabled) { color: var(--text-primary); }
    .wiki-page-btn.disabled { color: var(--border); cursor: default; }
    .wiki-page-num { color: var(--text-dim); }
    .wiki-tabs {
      display: flex; gap: 0; margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .wiki-tab {
      padding: 2px 10px; font-size: 11px; letter-spacing: 1px;
      color: var(--text-dim); cursor: pointer; text-transform: uppercase;
      border-bottom: 2px solid transparent;
    }
    .wiki-tab:hover { color: var(--text-primary); }
    .wiki-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .wiki-chain-row {
      padding: 2px 0; font-size: 13px;
    }
    .wiki-chain-label {
      color: var(--text-dim); display: inline-block; width: 90px; font-size: 11px;
      letter-spacing: 0.5px; text-transform: uppercase;
    }
    .wiki-chain-death {
      padding: 4px 0; border-bottom: 1px solid var(--border);
    }

    /* Sidebar */
    .sidebar-win .win-body { font-size: 13px; }

    /* Command */
    #command-win .win-body {
      display: flex; align-items: center; gap: 8px; padding: 4px 10px;
    }
    #command-win .prompt-char { color: var(--text-dim); flex-shrink: 0; }
    #command-win input {
      flex: 1; background: none; border: none; color: var(--text-primary);
      font-family: inherit; font-size: 14px; outline: none;
    }
    #command-win input::placeholder { color: var(--text-dim); opacity: 0.5; }

    /* Dialog overlay */
    .dialog-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .dialog-win {
      border: 1px solid var(--border); border-radius: 2px; background: var(--bg-primary);
      max-width: 500px; width: 90%; max-height: 60vh; display: flex; flex-direction: column;
    }
    .dialog-title {
      background: var(--win-title-bg); padding: 4px 10px; font-size: 12px;
      color: var(--text-npc); border-bottom: 1px solid var(--border); letter-spacing: 1px;
    }
    .dialog-body {
      padding: 12px 16px; overflow-y: auto;
      font-family: Georgia, 'Times New Roman', serif; font-size: 15px;
      line-height: 1.6; color: var(--text-primary);
    }

    /* Typewriter */
    .tw-line { min-height: 1.6em; }
    .tw-cursor {
      color: var(--text-npc); animation: blink-cursor 0.8s step-end infinite;
    }
    @keyframes blink-cursor { 50% { opacity: 0; } }

    /* Narrative blocks */
    .narrative-block { margin-bottom: 16px; animation: fadeIn 0.3s ease; }
    .narrative-block.player-action {
      font-style: italic; border-left: 2px solid var(--border);
      padding-left: 10px; color: var(--text-dim);
    }
    .narrative-block.system {
      color: var(--text-system); font-family: 'Courier New', monospace; font-size: 13px;
    }

    /* Entity links */
    .entity-link { text-decoration: underline dotted; cursor: pointer; transition: opacity 0.15s; }
    .entity-link:hover { opacity: 0.8; }
    .entity-npc { color: var(--text-npc); }
    .entity-item { color: #a335ee; }
    .entity-exit { color: #50c8c8; }
    .entity-location { color: var(--text-location); }

    /* Inline text styles */
    .npc-name, .npc { color: var(--text-npc); }
    .damage { color: var(--text-damage); font-weight: bold; }
    .heal { color: var(--text-heal); }
    .italic { font-style: italic; }
    .bold { font-weight: bold; }
    .location { color: var(--text-location); }

    /* Sidebar elements */
    .bar-fill-hp { color: var(--text-damage); }
    .bar-fill-xp { color: var(--accent); }
    .bar-empty { color: var(--border); }
    .stat-label { color: var(--text-dim); display: inline-block; width: 24px; }
    .exit-row { cursor: pointer; padding: 1px 0; }
    .exit-row:hover { color: #fff; }
    .exit-dir { color: #50c8c8; }
    .exit-dest { color: var(--text-dim); margin-left: 4px; }
    .npc-row { padding: 1px 0; cursor: pointer; }
    .npc-row:hover .npc { color: #fff; }
    .npc-diamond { color: var(--text-npc); margin-right: 4px; }
    .npc-role { color: var(--text-dim); margin-left: 4px; }
    .item-row { padding: 1px 0; }
    .item-bullet { color: var(--text-dim); margin-right: 4px; }
    .item-equip { color: var(--text-dim); margin-left: 4px; font-size: 11px; }
    .empty-msg { color: var(--text-dim); font-style: italic; }

    /* Quest panel */
    .quest-entry { padding: 4px 0; border-bottom: 1px solid var(--border); }
    .quest-entry.completed { opacity: 0.5; }
    .quest-name { color: var(--accent); font-size: 13px; }
    .quest-done { color: var(--text-heal); font-size: 11px; margin-left: 4px; }
    .quest-giver { color: var(--text-npc); font-size: 11px; }
    .quest-progress { font-size: 11px; margin: 2px 0; }
    .quest-stage { color: var(--text-dim); margin-left: 4px; }
    .quest-desc { color: var(--text-dim); font-size: 11px; line-height: 1.4; margin-top: 2px; }

    /* Faction panel */
    .faction-entry { padding: 4px 0; border-bottom: 1px solid var(--border); }
    .faction-name { color: var(--text-primary); font-size: 13px; }
    .faction-bar { font-size: 11px; margin: 2px 0; }
    .faction-hostile { color: var(--text-damage); }
    .faction-neutral { color: var(--text-dim); }
    .faction-friendly { color: var(--text-heal); }
    .faction-disposition { font-size: 11px; margin-left: 4px; }

    /* Event notifications */
    .narrative-block.event-combat { color: var(--text-damage); font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold; }
    .narrative-block.event-xp { color: var(--accent); font-family: 'Courier New', monospace; font-size: 13px; }
    .narrative-block.event-item { color: #a335ee; font-family: 'Courier New', monospace; font-size: 13px; }
    .narrative-block.event-death { color: var(--text-damage); font-family: 'Courier New', monospace; font-size: 14px; letter-spacing: 1px; }
    .narrative-block.death-feed { color: var(--text-damage); opacity: 0.7; font-family: 'Courier New', monospace; font-size: 12px; border-left: 2px solid var(--text-damage); padding-left: 8px; }

    /* Thinking */
    .thinking { color: var(--text-system); font-style: italic; font-family: 'Courier New', monospace; font-size: 13px; }
    .thinking::after { content: ''; animation: dots 1.5s steps(4,end) infinite; }
    @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }

    /* Health bar */
    .health-bar { height: 6px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 2px; }
    .health-bar-fill { height: 100%; background: var(--text-damage); transition: width 0.3s; }

    /* Skills */
    .skills-section { margin-top: 6px; border-top: 1px solid var(--border); padding-top: 4px; }
    .skill-row { display: flex; justify-content: space-between; padding: 1px 0; }
    .skill-name { color: var(--text-dim); font-size: 12px; }
    .skill-dots { color: var(--accent); font-size: 10px; letter-spacing: 1px; }
    .archetype-label { color: var(--accent); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }

    /* Archetype cards */
    .archetype-cards {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
      max-width: 500px; width: 100%;
    }
    .archetype-card {
      border: 1px solid var(--border); border-radius: 2px; padding: 12px;
      cursor: pointer; background: var(--bg-panel); transition: border-color 0.2s;
    }
    .archetype-card:hover { border-color: var(--text-dim); }
    .archetype-card.selected { border-color: var(--accent); }
    .archetype-name { color: var(--accent); font-size: 14px; font-weight: bold; text-transform: capitalize; margin-bottom: 4px; }
    .archetype-desc { color: var(--text-dim); font-size: 12px; margin-bottom: 6px; }
    .archetype-stats { color: var(--text-primary); font-size: 11px; margin-bottom: 2px; }
    .archetype-items { color: var(--text-dim); font-size: 11px; font-style: italic; }

    /* Overlays */
    #char-create-overlay {
      position: fixed; inset: 0; background: var(--bg-primary);
      display: flex; align-items: center; justify-content: center; z-index: 200;
      flex-direction: column; gap: 16px;
    }
    #char-create-overlay h1 { color: var(--accent); font-size: 24px; letter-spacing: 4px; }
    #char-create-overlay p { color: var(--text-dim); }
    #char-create-overlay input {
      background: var(--input-bg); border: 1px solid var(--border); color: var(--text-primary);
      font-family: inherit; font-size: 16px; padding: 8px 16px; text-align: center;
      outline: none; width: 240px;
    }
    #char-create-overlay input:focus { border-color: var(--accent); }
    #char-create-overlay button {
      background: var(--accent); color: #fff; border: none; padding: 8px 24px;
      font-family: inherit; cursor: pointer;
    }
    #wallet-connect-btn {
      background: var(--accent); color: #fff; border: none; padding: 8px 24px;
      font-family: inherit; cursor: pointer;
    }
    #wallet-address { margin-bottom: 8px; }
    .hidden { display: none !important; }

    #death-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      display: flex; align-items: center; justify-content: center; z-index: 200;
      flex-direction: column; gap: 16px; color: var(--text-damage);
    }
    #death-overlay h1 { font-size: 28px; letter-spacing: 6px; }
    #death-overlay .death-cause { color: var(--text-dim); font-size: 14px; }
    #death-overlay button {
      background: none; border: 1px solid var(--border); color: var(--text-primary);
      padding: 8px 24px; font-family: inherit; cursor: pointer; margin-top: 16px;
    }
    /* Status footer */
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 2px 12px; font-size: 11px; color: var(--text-dim);
      border: 1px solid var(--border); border-radius: 2px;
      background: var(--bg-primary);
    }
    .status-phase { min-width: 180px; }
    .status-phase.synced { color: var(--text-heal); }
    .status-phase.error { color: var(--text-damage); }
    .status-phase.processing,
    .status-phase.extracting,
    .status-phase.fetching,
    .status-phase.pushing,
    .status-phase.thinking { color: var(--text-npc); }
    .status-chain { text-align: center; }
    .status-chain.connected { color: var(--text-heal); }
    .status-tick { text-align: right; min-width: 80px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="tui-header"></div>
    <div id="tui-main">
      <div id="left-col">
        <div id="narrative-mount"></div>
        <div id="map-mount"></div>
      </div>
      <div id="right-col">
        <div id="character-mount"></div>
        <div id="inventory-mount"></div>
        <div id="exits-mount"></div>
        <div id="present-mount"></div>
        <div id="quest-mount"></div>
        <div id="faction-mount"></div>
      </div>
    </div>
    <div id="command-mount"></div>
    <div id="status-mount"></div>
    <div id="dialog-mount"></div>
  </div>
  <div id="char-create-overlay">
    <h1>MEMENTO MORI</h1>
    <!-- Step 1: Wallet -->
    <div id="wallet-step">
      <p id="wallet-prompt">Connect your wallet to enter</p>
      <button id="wallet-connect-btn">Connect Wallet</button>
      <p id="wallet-no-provider" class="hidden" style="color: var(--text-damage); font-size: 13px;">
        A browser wallet is required to play Memento Mori.
      </p>
    </div>
    <!-- Step 2: Archetype selection (hidden until wallet connected) -->
    <div id="archetype-step" class="hidden">
      <p style="color: var(--text-dim); margin-bottom: 8px;">Choose your path</p>
      <div id="archetype-cards" class="archetype-cards"></div>
      <button id="archetype-next-btn" style="margin-top: 12px;">Continue</button>
    </div>
    <!-- Step 3: Name (hidden until archetype selected) -->
    <div id="name-step" class="hidden">
      <p id="wallet-address" style="color: var(--text-heal); font-size: 12px; letter-spacing: 1px;"></p>
      <p>What is your name, wanderer?</p>
      <input type="text" id="char-name-input" placeholder="Enter name" />
      <button id="char-create-btn">Enter the World</button>
    </div>
  </div>
  <div id="death-overlay" class="hidden">
    <h1>YOU HAVE DIED</h1>
    <p class="death-cause" id="death-cause"></p>
    <p id="death-stats"></p>
    <button id="death-restart-btn">Begin Again</button>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
