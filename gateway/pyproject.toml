[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "memento-gateway"
version = "0.1.0"
description = "FastAPI gateway for Memento Mori"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "matrix-nio>=0.24,<1.0",
    "redis>=5.0,<6.0",
    "websockets>=12.0,<14.0",
    "mcp>=1.23,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
