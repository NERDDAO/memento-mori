services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - ./client:/srv/client:ro
    depends_on:
      - gateway
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    expose:
      - "8080"
    env_file: .env
    environment:
      - MATRIX_HOMESERVER=http://synapse:8008
      - MUD_INDEXER_URL=http://indexer:3001
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - synapse
      - redis
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    env_file: .env
    environment:
      - MATRIX_HOMESERVER=http://synapse:8008
    depends_on:
      - synapse
    restart: unless-stopped

  synapse:
    image: matrixdotorg/synapse:latest
    volumes:
      - synapse_data:/data
      - ./synapse/homeserver.yaml:/data/homeserver.yaml:ro
    expose:
      - "8008"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  indexer:
    build:
      context: ./contracts
      dockerfile: Dockerfile.indexer
    expose:
      - "3001"
    environment:
      - REDSTONE_RPC=${REDSTONE_RPC:-http://localhost:8545}
      - MUD_WORLD_ADDRESS=${MUD_WORLD_ADDRESS}
    restart: unless-stopped

volumes:
  caddy_data:
  synapse_data:
  redis_data:
