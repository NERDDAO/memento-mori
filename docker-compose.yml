services:
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: memento-synapse
    volumes:
      - memento-mori-synapse-data:/data
      - ./matrix/appservice-bonfires.yaml:/data/appservices/bonfires.yaml:ro
    ports:
      - "8008:8008"

volumes:
  memento-mori-synapse-data:
    external: true
