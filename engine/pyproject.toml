[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "memento-engine"
version = "0.1.0"
description = "CrewAI-powered RPG engine for Memento Mori"
requires-python = ">=3.10"
dependencies = [
    "crewai[tools]>=0.100,<1.0",
    "bonfires>=0.4.0,<1.0",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "web3>=6.0.0,<8.0",
    "requests>=2.28",
    "Pillow>=10.0",
    "numpy>=1.24",
    "tracery>=0.1.1",
    "trimtab>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "motor>=3.4",
    "mongomock-motor>=0.0.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
